<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login</title>
</head>
<body background="1.png" text="white" link="#4da3ff" vlink="#b388ff">

    <table width="100%" height="900">
        <tr>
            <td align="center">

                <table width="420" bgcolor="#0b0b12" border="2" cellpadding="30" cellspacing="0">
                    <tr>
                        <td align="center">

                            <h1>Login</h1>
                            <p>Welcome back, DC fan</p>
                            <hr>

                            <form action="2.html">
                                <table cellpadding="8" align="center">
                                    <tr>
                                        <td align="left">
                                            <label for="email"><b>Email</b></label>
                                            <br>
                                            <input type="email" id="email" name="email" placeholder="Enter your email" size="35" required>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td align="left">
                                            <label for="password"><b>Password</b></label>
                                            <br>
                                            <input type="password" id="password" name="password" placeholder="Enter your password" size="35" required>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td align="left">
                                            <input type="checkbox" id="remember" name="remember">
                                            <label for="remember">Remember me</label>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td align="center">
                                            <button type="submit">Login</button>
                                            <button type="reset">Clear</button>
                                        </td>
                                    </tr>
                                </table>
                            </form>

                            <hr>
                            <p>Don't have an account? <a href="signup.html">Sign up</a></p>

                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>

</body>
</html>
